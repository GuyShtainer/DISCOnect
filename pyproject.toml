[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "disconect"
version = "0.1.0.dev0"
description = "Local-first, cloud-free health data store for Garmin watches: watch-file ingest, SQLite, MCP tools."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "AGPL-3.0-or-later" }
dependencies = [
    "fitdecode>=0.11,<0.12",
    "sqlcipher3>=0.6,<0.7",
    "argon2-cffi>=23",
    "cryptography>=42",
    "mnemonic>=0.21",
    "keyring>=25",
]

[project.urls]
Repository = "https://github.com/GuyShtainer/DISCOnect"

[project.optional-dependencies]
mcp = ["mcp>=2.2,<3"]
dev = ["pytest>=8"]

[project.scripts]
disconect = "disconect.cli:main"
disconect-mcp = "disconect.mcp_server:main"
disconect-serve = "disconect.serve:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
